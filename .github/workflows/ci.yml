name: Build and validate NC33 package

on:
  push:
    branches:
      - main
      - 'port/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-runtime-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq patch shellcheck

      - name: Check shell scripts for errors
        run: shellcheck --severity=error scripts/*.sh

      - name: Report shell script warnings
        continue-on-error: true
        run: shellcheck --severity=warning scripts/*.sh

      - name: Build complete patched application
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/*.sh
          ./scripts/build.sh 2>&1 | tee build.log

      - name: Show upstream and package metadata
        run: |
          for metadata in build/UPSTREAM_*; do
            echo "--- ${metadata}"
            cat "${metadata}"
          done
          cat build/*.tar.gz.sha256

      - name: Test real automatic login in disposable Nextcloud 33
        shell: bash
        run: |
          set -o pipefail
          ./scripts/runtime-test-real-runner.sh 2>&1 | tee runtime-test.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snappymail-nextcloud-nc33-diagnostics
          path: |
            build.log
            runtime-test.log
            build/UPSTREAM_*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: snappymail-nextcloud-nc33
          path: |
            build/snappymail-nextcloud-nc33-*.tar.gz
            build/snappymail-nextcloud-nc33-*.tar.gz.sha256
            build/UPSTREAM_*
          if-no-files-found: error
          retention-days: 14
